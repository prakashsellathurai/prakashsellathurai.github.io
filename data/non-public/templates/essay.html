<!doctype html>
<html lang="en">
  {{head}}
  <body class="skin-vector essay-page">
    {{header}}
    <h1 id="firstHeading">{{essay.title}}</h1>
    {{toc}}
    <div class="article-content content-with-sidenotes">
      <p class="meta"><time>{{essay.date}}</time></p>
      {{essay.content}}
      <div id="catlinks"><span class="catlinks-title">Tags:</span>{{essay.tags}}</div>
    </div>
    {{footer}}
  </body>
</html>
