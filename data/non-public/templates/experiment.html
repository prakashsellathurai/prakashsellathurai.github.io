<!doctype html>
<html lang="en">
{{head}}
<body class="gb-notes">
  {{experimentsSidebar}}
  <div class="gb-main">
    <nav class="gb-topbar">
      <a href="/experiments/">Experiments</a>
    </nav>
    <div class="gb-scroll">
      <article class="gb-content">
        <div class="content gitbook-markdown-body">{{experiment.content}}</div>
      </article>
      {{experimentsPager}}
    </div>
  </div>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="/static/js/gitbook-search.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/11.12.0/mermaid.min.js"></script>
  <script>
    document.querySelectorAll("pre > code.language-mermaid").forEach(function (code) {
      var pre = code.parentElement;
      pre.classList.add("mermaid");
      pre.removeChild(code);
    });
    mermaid.initialize({ startOnLoad: true });
  </script>
  <script>hljs.highlightAll();</script>
</body>
</html>
