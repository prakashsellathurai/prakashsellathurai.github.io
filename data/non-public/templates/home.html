<!doctype html>
<html lang="en">
{{head}}
<body class="skin-vector">
{{header}}
  <div id="mp-welcome">
    <h2>Welcome to {{metadata.author}}'s Web Page</h2>
    <p>{{metadata.shortDescription}}</p>
  </div>

  <div class="mp-columns">
    <div class="mp-column mp-left">
      <div class="mp-box">
        <div class="mp-box-header">From today's featured article</div>
        <div class="mp-box-body">{{featuredArticle}}</div>
      </div>
      <div class="mp-box">
        <div class="mp-box-header">Did you know&hellip;</div>
        <div class="mp-box-body">{{didYouKnow}}</div>
      </div>
    </div>
    <div class="mp-column mp-right">
      <div class="mp-box">
        <div class="mp-box-header">In the news</div>
        <div class="mp-box-body">{{inTheNews}}</div>
      </div>
      <div class="mp-box">
        <div class="mp-box-header">On this day</div>
        <div class="mp-box-body">{{onThisDay}}</div>
      </div>
    </div>
  </div>

  <section class="projects-section">
    <h2>Featured projects</h2>
    {{featuredProjects}}
  </section>
{{footer}}
</body>
</html>
