<!doctype html>
<html lang="en">
{{head}}
<body class="gb-notes">
  {{notesSidebar}}
  <div class="gb-main">
    <nav class="gb-topbar">
      <a href="/notes/">Notes</a><span class="gb-crumb-sep">/</span><span>{{note.title}}</span>
    </nav>
    <div class="gb-scroll">
      <article class="gb-content">
        <h1>{{note.title}}</h1>
        <div class="content gitbook-markdown-body">{{note.content}}</div>
      </article>
      {{notesPager}}
    </div>
  </div>
</body>
</html>
