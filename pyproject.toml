[project]
name = "prakashsellathurai-github-io"
version = "0.1.0"
description = "Personal website and blog for Prakash Sellathurai"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.12",
    "jinja2>=3.1.6",
    "nbconvert[serve,test,webpdf]>=7.17.1",
    "nbformat>=5.10.4",
    "pyyaml>=6.0.3",
    "ssserve>=0.3.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-playwright>=0.6",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "--strict-markers"]
